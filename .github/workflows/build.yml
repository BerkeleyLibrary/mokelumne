name: Build / Test / Push

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  BUILD_SUFFIX: -build-${{ github.run_id }}_${{ github.run_attempt }}
  DOCKER_METADATA_SET_OUTPUT_ENV: 'true'

jobs:
  docker-build:
    uses: BerkeleyLibrary/.github/.github/workflows/docker-build.yml@3.1.0
    with:
      image: ghcr.io/${{ github.repository }}
    secrets: inherit

  test:
    runs-on: ubuntu-24.04
    needs: docker-build
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      DOCKER_APP_IMAGE: ${{ needs.docker-build.outputs.image }}
      AIRFLOW_UID: "1001"
    outputs:
      compose-logs: ${{ steps.artifacts.outputs.compose-logs }}
      compose-config: ${{ steps.artifacts.outputs.compose-config }}
      docker-events: ${{ steps.artifacts.outputs.docker-events }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Basic setup
        run: |
          ARTIFACTS_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          echo "ARTIFACTS_DIR=${ARTIFACTS_DIR}" >> $GITHUB_ENV
          echo "TEST_START=$(date +%s)" >> $GITHUB_ENV

      - name: Pull dependencies
        run: |
          docker compose pull --quiet

      - name: Generate .env
        run: |
          docker compose run \
            --entrypoint /opt/airflow/scripts/setup_dev.py \
            --no-deps \
            --rm \
            --volume ./:/opt/airflow \
            airflow-init

      - name: Start the stack
        run: |
          docker compose up --detach

      - name: Run tests
        run: |
          docker compose exec airflow-cli python -m pytest

      - name: Copy out artifacts
        if: ${{ always() }}
        id: artifacts
        run: |
          docker compose cp airflow-cli:/opt/airflow/artifacts/ "${ARTIFACTS_DIR}" || true
          docker compose logs | tee "${ARTIFACTS_DIR}/docker-services.log"
          docker compose config | tee "${ARTIFACTS_DIR}/docker-compose.merged.yml"
          docker events --json --since $TEST_START --until `date +%s` | tee "${ARTIFACTS_DIR}/docker-events.json"

      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mokelumne Test Report (${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }})
          path: ${{ env.ARTIFACTS_DIR }}
          if-no-files-found: error

  push:
    needs:
      - docker-build
      - test
    uses: BerkeleyLibrary/.github/.github/workflows/docker-push.yml@3.1.0
    with:
      image: ghcr.io/${{ github.repository }}
      build-image-arm64: ${{ needs.docker-build.outputs.image-arm64 }}
      build-image-x64: ${{ needs.docker-build.outputs.image-x64 }}
    secrets: inherit
