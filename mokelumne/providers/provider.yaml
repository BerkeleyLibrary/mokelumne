package-name: mokelumne
name: Mokelumne
description: Mokelumne Airflow provider.
connection-types:
  - connection-type: tind
    hook-class-name: mokelumne.providers.tind.hooks.tind.TindHook
    hook-name: TIND
    ui-field-behaviour:
      hidden-fields:
        - port
        - schema
        - login
        - extra
      relabeling:
        host: TIND API URL
        password: TIND API Key
      placeholders:
        host: "e.g. https://digicoll.lib.berkeley.edu/api/v1"
        password: Your-Tind-API-key
  - connection-type: ldc
    hook-class-name: mokelumne.providers.ldc.hooks.ldc.LDCHook
    hook-name: Linguistic Data Consortium
    ui-field-behaviour:
      hidden-fields:
        - port
        - schema
        - extra
      relabeling:
        host: LDC Catalog URL
        login: LDC Login Username
        password: LDC Password
      placeholders:
        host: "https://catalog.ldc.upenn.edu"
        login: "your-ldc-username"
        password: "your-ldc-password"
